<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Lightbox</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .gallery { display: flex; flex-wrap: wrap; gap: 20px; }
    .gallery img { width: 200px; height: auto; cursor: pointer; border-radius: 8px; transition: transform 0.2s; }
    .gallery img:hover { transform: scale(1.05); }

    /* lightbox */
    #lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; z-index:3000; }
    #lightbox img { max-width:90%; max-height:90%; object-fit:contain; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.5); }
    #lightbox button#lightbox-close { position:absolute; top:18px; right:26px; font-size:2.2rem; color:#fff; background:none; border:none; cursor:pointer; }
  </style>
</head>
<body>

  <h1>Page test Lightbox</h1>

  <div class="gallery">
    <img src="https://picsum.photos/400/250?random=1" alt="Photo test 1">
    <img src="https://picsum.photos/400/250?random=2" alt="Photo test 2">
    <img src="https://picsum.photos/400/250?random=3" alt="Photo test 3" class="icon-title"> <!-- icône exclue -->
    <img src="https://picsum.photos/400/250?random=4" alt="Photo test 4">
  </div>

  <!-- script placé en bas -->
  <script src="./script.js"></script>
</body>
</html>
